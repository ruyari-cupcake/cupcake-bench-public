<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logbook · conversation editor</title><link rel="stylesheet" href="/style.css"></head>
<body><header><span class="eyebrow">A LITTLE SPACE FOR YOUR STORIES</span><h1>Logbook<span>✦</span></h1><p>Shape a conversation. Keep its details.</p></header>
<main><section class="workspace" aria-label="Editor"><label class="title-label">Title<input id="title" aria-label="Title"></label>
<details open><summary>Start from a transcript</summary><label>Transcript<textarea id="transcript" aria-label="Transcript" placeholder="Mina: A new story begins…"></textarea></label><button id="replace">Replace from text</button></details>
<div id="editors"><h2>Speakers</h2><div id="speakers"></div><h2>Conversation</h2><div id="messages"></div></div>
<div id="tools"><div class="toolbar"><button id="undo">Undo</button><button id="redo">Redo</button><button id="save" class="primary">Save</button><button id="load">Load</button></div></div>
<details open><summary>Document bundle</summary><div class="toolbar"><button id="export">Export JSON</button><button id="import">Import JSON</button></div><label>Bundle<textarea id="bundle" aria-label="Bundle" spellcheck="false"></textarea></label></details>
<p id="status" role="status" aria-live="polite">Starting…</p></section>
<section class="preview-shell"><span class="eyebrow">THE FINISHED PAGE</span><h2>Preview</h2><div id="preview" role="region" aria-label="Preview"></div></section></main>
<footer>Saved locally in this browser. Export a bundle to keep a portable copy.</footer>
<script type="module" src="/src/app.js"></script></body></html>
